schema_version = 1

[policy]
require_cross_quota_family = true
retry_same_objective = true
unclassified_failure = "no-fallback"

[failure_classification]
retryable_http_status = [429]
retryable_markers = [
  "rate limit",
  "rate_limit_exceeded",
  "usage limit",
  "usage_limit",
  "quota exceeded",
  "quota_exceeded",
  "freeusagelimiterror",
  "too many requests",
]
non_fallback_markers = [
  "authentication",
  "unauthorized",
  "forbidden",
  "permission denied",
  "context length",
  "context window",
  "validation error",
  "invalid request",
  "tool error",
  "safety",
]

[fallbacks.build]
role = "build"
fallback_agent = "build-fallback"
profiles = ["global", "agent-core"]
target_models = { global = "spark", agent-core = "spark" }
automatic = { global = false, agent-core = false }
max_retries = 1

